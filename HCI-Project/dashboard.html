<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        ☰
    </div>

    <!-- Main Content -->
    <div class="main">

        <!-- Graph Section -->
        <div class="card">
            <div class="card-header">
                <h3>Graph</h3>
                <a href="#">See more</a>
            </div>

            <div class="graph-container">
                <div class="graph-box">Pie Chart</div>
                <div class="graph-box">Line Chart</div>
            </div>
        </div>

        <!-- Residents -->
        <div class="card">
            <div class="card-header">
                <h3>Residents</h3>
                <a href="#">See more</a>
            </div>

            <table>
                <tr>
                    <th>Barangay</th>
                    <th>Females</th>
                    <th>Males</th>
                    <th>Total</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td>55</td>
                    <td>60</td>
                    <td>115</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>40</td>
                    <td>50</td>
                    <td>90</td>
                </tr>
            </table>
        </div>

        <!-- Projects -->
        <div class="card">
            <div class="card-header">
                <h3>Projects</h3>
                <a href="#">See more</a>
            </div>

            <div class="projects">
                <div class="project-card">
                    <img src="https://via.placeholder.com/150">
                    <p>Road Repair</p>
                </div>

                <div class="project-card">
                    <img src="https://via.placeholder.com/150">
                    <p>Health Program</p>
                </div>

                <div class="project-card">
                    <img src="https://via.placeholder.com/150">
                    <p>Community Event</p>
                </div>

                <div class="project-card">
                    <img src="https://via.placeholder.com/150">
                    <p>Learning Center</p>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
